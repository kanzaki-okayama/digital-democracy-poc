  <link rel="stylesheet" href="css/style.css" />

<body>
  <!-- 🧭 ナビゲーションバー -->
  <header class="navbar">
    <div class="navbar-title">デジタル民主主義PoC</div>

    <!-- 🍔 ハンバーガーメニュー (Mobile only) -->
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>

    <nav class="navbar-menu" id="navbarMenu">
      <button class="nav-link" data-page="map">意見投稿マップ</button>
      <button class="nav-link" data-page="relation">関係性マップ</button>
      <button class="nav-link" data-page="ideas">課題解決アイデア</button>
      <button class="nav-link" data-page="about">このサイトについて</button>
    </nav>
  </header>

  <!-- 🧩 コンテンツ領域 -->
  <main id="content">
    <!-- main.js によって動的にコンテンツが挿入されます -->
  </main>

  <!-- 💬 投稿モーダル -->
  <div id="postModal" class="modal" hidden>
    <div class="modal-inner">
      <h3>新しい意見を投稿</h3>
      <div id="regionDisplay" style="font-size:13px; color:#555; margin-bottom:8px;"></div>
      <label>ニックネーム</label>
      <input id="displayName" maxlength="50" placeholder="例：岡山市民A" />
      <label>内容</label>
      <textarea id="postContent" rows="4" maxlength="2000" placeholder="この場所についてのご意見…"></textarea>
      <div class="actions">
        <button id="cancelBtn">キャンセル</button>
        <button id="submitBtn">投稿する</button>
      </div>
    </div>
  </div>

  <!-- 💬 投稿詳細オーバーレイ -->
  <div id="postOverlay" class="overlay" hidden>
    <div class="overlay-inner">
      <button id="closeOverlayBtn" class="overlay-close">✕</button>
      <div id="overlayContent" class="overlay-content"></div>
    </div>
  </div>

  <!-- ✅ Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- 👇 Main logic -->
  <script type="module" src="js/main.js?v=3"></script>

  <!-- トースト通知 -->
  <div id="toast" class="toast"></div>
</body>

</html>
