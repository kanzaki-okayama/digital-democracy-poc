<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岡山市議会 デジタル民主主義ダッシュボード</title>
    <script src="lib/tailwind.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script type="text/javascript" src="lib/vis-network.min.js"></script>
    <script src="lib/chart.min.js"></script>
    <script src="date.js"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Network Container */
        #mynetwork {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        /* Side Panel (Network) */
        .side-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 350px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-left: 1px solid #334155;
            backdrop-filter: blur(10px);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .side-panel.open {
            transform: translateX(0);
        }

        /* Flow View Columns */
        .flow-col {
            height: 100%;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .flow-col {
                border-right: 1px solid #334155;
            }
        }

        /* Cards */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #64748b;
            transform: translateY(-2px);
        }

        .card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>

<body class="flex flex-col h-screen">

    <!-- Navbar -->
    <header class="flex items-center justify-between px-4 md:px-6 py-3 bg-slate-900 border-b border-slate-700 z-50">
        <div class="flex items-center gap-3 md:gap-4">
            <h1 class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-400 cursor-pointer"
                onclick="goHome()">
                <span class="hidden sm:inline">Digital Democracy Dashboard</span>
                <span class="sm:hidden">DDD Okayama</span>
            </h1>
            <nav class="flex gap-1 bg-slate-800 p-1 rounded-lg">
                <button onclick="switchTab('home')" id="tab-home"
                    class="px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-medium transition-colors bg-slate-700 text-white">Home</button>
                <button onclick="startFlow('all')" id="tab-flow"
                    class="px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-medium transition-colors text-slate-400 hover:text-white">議論の状況</button>
            </nav>
        </div>
        <div id="active-context" class="hidden items-center gap-2 text-sm text-slate-300">
            <span class="w-2 h-2 rounded-full bg-green-400"></span>
            <span id="context-label">Viewing All</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 relative overflow-hidden">

        <!-- VIEW: HOME -->
        <div id="view-home" class="absolute inset-0 overflow-y-auto p-8 fade-in">
            <div class="max-w-6xl mx-auto space-y-12">

                <!-- Hero Section -->
                <div class="text-center space-y-4 py-6 md:py-10">
                    <h2 class="text-2xl md:text-4xl font-extrabold text-white leading-tight">議会の「今」を、<br
                            class="md:hidden">多角的に可視化する。</h2>
                    <p class="text-sm md:text-base text-slate-400 max-w-2xl mx-auto px-4">
                        令和7年の全議事録データをAIが解析。膨大な議論の中から、あなたの関心に近いトピックや、隠れた因果関係を発見してください。</p>
                </div>

                <!-- 1. Perspective Selector -->
                <div class="space-y-6">
                    <h3 class="text-xl font-bold text-slate-200 border-l-4 border-blue-500 pl-4">あなたの立場に近い視点でみる</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                        <!-- Row 1 -->
                        <button onclick="startFlow('citizen')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-blue-500 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                🏘️</div>
                            <h4 class="text-lg font-bold text-white mb-2">市民として</h4>
                            <p class="text-sm text-slate-400">生活環境、防災、ゴミ処理など、日々の暮らしの基盤に関わる議論。</p>
                        </button>

                        <button onclick="startFlow('parenting')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-pink-400 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                🧸</div>
                            <h4 class="text-lg font-bold text-white mb-2">子育て世代として</h4>
                            <p class="text-sm text-slate-400">保育、教育、公園整備、医療費助成など、次世代育成に関する重要トピック。</p>
                        </button>

                        <button onclick="startFlow('youth')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-cyan-400 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                skateboard </div>
                            <h4 class="text-lg font-bold text-white mb-2">若者として</h4>
                            <p class="text-sm text-slate-400">スポーツ、文化、イベント、雇用、未来のまちづくりに関する話題。</p>
                        </button>

                        <!-- Row 2 -->
                        <button onclick="startFlow('business')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-amber-500 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                💼</div>
                            <h4 class="text-lg font-bold text-white mb-2">事業者として</h4>
                            <p class="text-sm text-slate-400">地域経済、観光振興、入札・契約、産業支援策などのビジネス関連情報。</p>
                        </button>

                        <button onclick="startFlow('senior')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-green-500 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                🧓</div>
                            <h4 class="text-lg font-bold text-white mb-2">高齢者として</h4>
                            <p class="text-sm text-slate-400">医療、介護、交通（バス・タクシー）、バリアフリーなど、シニア世代の課題。</p>
                        </button>

                        <button onclick="startFlow('all')"
                            class="group relative p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-purple-500 hover:bg-slate-750 transition text-left">
                            <div class="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition">
                                🌐</div>
                            <h4 class="text-lg font-bold text-white mb-2">すべて</h4>
                            <p class="text-sm text-slate-400">フィルタリングなしで、議会で議論された全てのプロジェクトと意見を探索します。</p>
                        </button>
                    </div>
                </div>

                <!-- 2. Trending Topics -->
                <div class="space-y-6">
                    <h3 class="text-xl font-bold text-slate-200 border-l-4 border-teal-500 pl-4">注目トピックから見る (Discussion
                        Ranking)</h3>
                    <div id="ranking-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- JS Injected Content -->
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW: FLOW -->
        <div id="view-flow" class="absolute inset-0 flex flex-col md:flex-row hidden bg-slate-900">
            <!-- Col 1: Project List -->
            <div id="flow-list-pane"
                class="w-full md:w-1/3 flow-col bg-slate-900 flex flex-col border-r border-slate-700">
                <div class="p-4 border-b border-slate-700 bg-slate-800/50 sticky top-0 z-10 backdrop-blur">
                    <h3 class="font-bold text-slate-200">プロジェクトを選択</h3>
                    <input type="text" id="project-search" placeholder="Search..." oninput="renderFlowProjectList()"
                        class="w-full mt-2 bg-slate-800 border border-slate-600 rounded px-3 py-1 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div id="flow-project-list" class="p-4 space-y-3">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Col 2: Details & Opinions -->
            <div id="flow-detail-pane"
                class="hidden md:flex flex-1 md:w-2/3 flow-col bg-slate-800/30 flex-col relative">
                <div id="flow-detail-placeholder"
                    class="flex flex-col items-center justify-center h-full text-slate-500">
                    <div class="text-4xl mb-4">👈</div>
                    <p>左側のリストからプロジェクトを選択してください</p>
                </div>
                <div id="flow-detail-content" class="hidden h-full flex flex-col">
                    <!-- Header -->
                    <div class="p-3 md:p-4 border-b border-slate-700 bg-slate-900/80 sticky top-0 z-10 backdrop-blur">
                        <div class="flex items-center gap-3">
                            <button onclick="backToFlowList()"
                                class="md:hidden p-2 -ml-2 text-slate-400 hover:text-white">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 19l-7-7 7-7"></path>
                                </svg>
                            </button>
                            <h2 id="detail-title" class="text-base md:text-2xl font-bold text-white truncate">Project
                                Name</h2>
                        </div>
                    </div>

                    <!-- Analytics (Chart) -->
                    <div class="p-4 md:p-6 border-b border-slate-700">
                        <h4 class="text-[10px] md:text-sm font-bold text-slate-500 uppercase mb-2">価値観構成 (<span
                                id="chart-context-label">すべて</span>)</h4>
                        <div class="h-44 md:h-52 w-full relative">
                            <canvas id="valueChart"></canvas>
                        </div>
                    </div>

                    <!-- Opinions List -->
                    <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900/30">
                        <div class="sticky top-0 z-20 bg-[#0f172a] pb-2 mb-4 border-b border-slate-800">
                            <div class="flex items-center justify-between py-2">
                                <div class="flex items-center gap-2">
                                    <h4 class="text-xs md:text-sm font-bold text-slate-400 uppercase">発言一覧</h4>
                                    <span id="detail-count"
                                        class="bg-slate-700 text-white px-2 py-0.5 rounded text-[10px]">0</span>
                                </div>
                                <div class="bg-slate-800 p-0.5 rounded-md flex gap-0.5 shadow-inner">
                                    <button onclick="setDetailFilter('all')" id="btn-d-all"
                                        class="px-2 py-1 text-[10px] md:text-xs font-bold rounded bg-blue-600 text-white transition">すべて</button>
                                    <button onclick="setDetailFilter('councilor')" id="btn-d-councilor"
                                        class="px-2 py-1 text-[10px] md:text-xs font-bold rounded text-slate-400 hover:text-white transition">議員</button>
                                    <button onclick="setDetailFilter('authority')" id="btn-d-authority"
                                        class="px-2 py-1 text-[10px] md:text-xs font-bold rounded text-slate-400 hover:text-white transition">行政</button>
                                </div>
                            </div>
                        </div>
                        <div id="detail-opinions" class="space-y-4">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-network" class="hidden"></div>
    </main>

    <script>
        let graphData = { nodes: [], edges: [] };
        try {
            const decoded = new TextDecoder().decode(Uint8Array.from(atob(RAW_GRAPH_DATA_B64), c => c.charCodeAt(0)));
            graphData = JSON.parse(decoded);
        } catch (e) { console.error(e); }

        const STATE = {
            activeTab: 'home',
            flowFilter: 'all',
            selectedProject: null,
            detailFilter: 'all'
        };

        const VALUE_AXES_DEF = [
            { id: 'Economic_Efficiency', label: '経済・効率', color: '#22c55e' },
            { id: 'Fairness_Justice', label: '公正・公平', color: '#3b82f6' },
            { id: 'Safety_Security', label: '安全・安心', color: '#eab308' },
            { id: 'Growth_Innovation', label: '成長・革新', color: '#ec4899' },
            { id: 'Tradition_Stability', label: '伝統・安定', color: '#f97316' },
            { id: 'Sustainability', label: '持続可能性', color: '#06b6d4' }
        ];

        function switchTab(tabId, bypassAutoStart = false) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.replace('bg-slate-700', 'bg-slate-800');
                el.classList.replace('text-white', 'text-slate-400');
            });
            const btn = document.getElementById(`tab-${tabId}`);
            if (btn) {
                btn.classList.replace('bg-slate-800', 'bg-slate-700');
                btn.classList.replace('text-slate-400', 'text-white');
            }
            STATE.activeTab = tabId;
            if (tabId === 'home') renderRanking();
            if (tabId === 'flow') {
                renderFlowProjectList();
                if (window.innerWidth < 768) backToFlowList();
            }
        }

        function goHome() { switchTab('home'); }

        function renderRanking() {
            const container = document.getElementById('ranking-container');
            container.innerHTML = '';
            const projectDegrees = [];
            graphData.nodes.forEach(n => {
                if (n.type === 'Project') {
                    const degree = graphData.edges.filter(e => e.target === n.id && e.type === 'TARGETS').length;
                    if (degree > 0) projectDegrees.push({ node: n, degree: degree });
                }
            });
            projectDegrees.sort((a, b) => b.degree - a.degree);
            projectDegrees.slice(0, 20).forEach((item, idx) => {
                const p = item.node;
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-4 rounded-lg border border-slate-700 hover:border-teal-500 cursor-pointer transition flex justify-between group";
                div.onclick = () => startFlowForProject(p.id);
                div.innerHTML = `<div class="flex items-center gap-3"><span class="text-slate-500 w-6">#${idx + 1}</span><div class="text-sm font-semibold text-slate-200 group-hover:text-teal-400">${p.label}</div></div><span class="text-xs bg-slate-900 px-2 py-1 rounded text-slate-400 border border-slate-700">${item.degree} op</span>`;
                container.appendChild(div);
            });
        }

        let valueChartInstance = null;
        function startFlow(filterType) {
            STATE.flowFilter = filterType;
            const configs = {
                'citizen': { label: '市民の視点', icon: '🏘️', border: 'border-blue-500' },
                'senior': { label: '高齢者の視点', icon: '🧓', border: 'border-green-500' },
                'youth': { label: '若者の視点', icon: ' skateboard ', border: 'border-cyan-400' },
                'business': { label: '事業者の視点', icon: '💼', border: 'border-amber-500' },
                'parenting': { label: '子育て世代の視点', icon: '🧸', border: 'border-pink-400' },
                'all': { label: 'すべての視点', icon: '🌐', border: 'border-purple-500' }
            };
            const conf = configs[filterType] || configs['all'];
            document.getElementById('active-context').innerHTML = `<div class="flex items-center gap-2 px-4 py-1.5 rounded-full border ${conf.border} bg-slate-800 shadow-sm transition-all"><span class="text-lg">${conf.icon}</span><span class="font-bold text-sm text-white">${conf.label}</span></div>`;
            document.getElementById('active-context').classList.remove('hidden');
            switchTab('flow', true);
            renderFlowProjectList();
        }

        function startFlowForProject(projectId) {
            startFlow('all');
            renderFlowProjectList();
            setTimeout(() => selectFlowProject(projectId), 100);
        }

        function backToFlowList() {
            STATE.selectedProject = null;
            document.getElementById('flow-list-pane').classList.remove('hidden');
            document.getElementById('flow-detail-pane').classList.add('hidden');
            document.querySelectorAll('#flow-project-list .card').forEach(el => el.classList.remove('active', 'border-blue-500'));
        }

        function renderFlowProjectList() {
            const list = document.getElementById('flow-project-list');
            list.innerHTML = '';
            let projects = graphData.nodes.filter(n => n.type === 'Project');
            const kwMap = {
                'senior': ['高齢', '介護', '老人', '医療', 'バス', '交通', '福祉', 'バリアフリー', '認知症'],
                'youth': ['若者', '学校', '教育', 'スポーツ', '文化', '就職', '未来', 'デジタル', 'イベント', '大学', '留学', '新アリーナ', 'スケート'],
                'business': ['経済', '産業', '観光', '企業', '中小企業', '商業', '開発', '支援', '補助金', '入札', 'アリーナ', '空港', '誘致'],
                'parenting': ['子育て', '保育', '教育', '学校', '公園', '小児', '手当', '産後', '給食', '児童', '母子'],
                'citizen': ['生活', '教育', '福祉', '環境', '公園', '道路', '防災', 'ゴミ', '水道', '税']
            };
            if (kwMap[STATE.flowFilter]) {
                projects = projects.filter(p => kwMap[STATE.flowFilter].some(k => p.label.includes(k)));
            }
            projects.sort((a, b) => (b.count || 0) - (a.count || 0));
            const search = document.getElementById('project-search').value.toLowerCase();
            if (search) projects = projects.filter(p => p.label.toLowerCase().includes(search));

            projects.forEach(p => {
                const degree = graphData.edges.filter(e => e.target === p.id).length;
                const div = document.createElement('div');
                div.id = `flow-p-${p.id}`;
                div.className = "card p-3 cursor-pointer " + (STATE.selectedProject === p.id ? 'active border-blue-500' : '');
                div.onclick = () => selectFlowProject(p.id);
                div.innerHTML = `<div class="flex justify-between items-start"><div class="font-bold text-sm text-slate-200">${p.label}</div><span class="text-xs text-slate-500 bg-slate-900 px-1.5 rounded">${degree}</span></div>`;
                list.appendChild(div);
            });
        }

        function selectFlowProject(projectId) {
            STATE.selectedProject = projectId;
            document.querySelectorAll('#flow-project-list .card').forEach(el => el.classList.remove('active', 'border-blue-500'));
            const activeEl = document.getElementById(`flow-p-${projectId}`);
            if (activeEl) activeEl.classList.add('active', 'border-blue-500');

            // プレースホルダーを非表示にし、コンテンツを表示（モバイル・デスクトップ共通）
            document.getElementById('flow-detail-placeholder').classList.add('hidden');
            document.getElementById('flow-detail-content').classList.remove('hidden');

            if (window.innerWidth < 768) {
                document.getElementById('flow-list-pane').classList.add('hidden');
                document.getElementById('flow-detail-pane').classList.remove('hidden', 'md:flex');
                document.getElementById('flow-detail-pane').classList.add('flex');
            }
            renderDetailContent(projectId);
        }

        function renderDetailContent(projectId) {
            const pNode = graphData.nodes.find(n => n.id === projectId);
            document.getElementById('detail-title').innerText = pNode.label;
            const opIds = graphData.edges.filter(e => e.target === projectId && e.type === 'TARGETS').map(e => e.source);
            let opinions = graphData.nodes.filter(n => opIds.includes(n.id) && n.type === 'Opinion');

            function getCategory(role) {
                if (!role) return 'authority';
                if (role.includes('議員') || role.includes('委員') || role.includes('議長')) return 'councilor';
                return 'authority';
            }

            const councilorOps = opinions.filter(op => getCategory(op.role) === 'councilor');
            const authorityOps = opinions.filter(op => getCategory(op.role) === 'authority');

            let filteredOpinions = opinions;
            let contextText = "すべて";
            if (STATE.detailFilter === 'councilor') {
                filteredOpinions = councilorOps;
                contextText = "議員の視点";
            } else if (STATE.detailFilter === 'authority') {
                filteredOpinions = authorityOps;
                contextText = "行政の視点";
            }

            document.getElementById('detail-count').innerText = filteredOpinions.length;
            document.getElementById('chart-context-label').innerText = contextText;

            // Render chart with comparison data if needed
            const datasets = [];
            if (STATE.detailFilter === 'all') {
                datasets.push({ label: '全体', ops: opinions, color: '#3b82f6', fill: true });
            } else if (STATE.detailFilter === 'councilor') {
                datasets.push({ label: '議員', ops: councilorOps, color: '#3b82f6', fill: true });
                datasets.push({ label: '行政 (比較)', ops: authorityOps, color: '#94a3b8', fill: false, dashed: true });
            } else if (STATE.detailFilter === 'authority') {
                datasets.push({ label: '行政', ops: authorityOps, color: '#22c55e', fill: true });
                datasets.push({ label: '議員 (比較)', ops: councilorOps, color: '#94a3b8', fill: false, dashed: true });
            }

            renderDynamicValueChart(datasets, pNode);
            const opList = document.getElementById('detail-opinions');
            opList.innerHTML = '';
            filteredOpinions.forEach(op => {
                const div = document.createElement('div');
                div.className = `bg-slate-800 p-4 rounded border-l-4 border-slate-600 cursor-pointer hover:bg-slate-750 transition-all`;
                div.onclick = () => selectOpinionForChart(op, div);

                div.innerHTML = `
                    <div class="text-xs text-slate-400 mb-2 flex justify-between">
                        <span class="font-bold"><span class="text-white text-base">${op.speaker || 'Unknown'}</span> ${op.role || ''}</span>
                        <span class="text-[10px] text-slate-500 font-mono">${op.date || ''}</span>
                    </div>
                    <div class="text-sm text-slate-200 leading-relaxed mb-2">
                        <div class="line-clamp-3" id="summary-${op.id}">${op.label || op.text || op.full_text}</div>
                        <div id="full-${op.id}" class="hidden mt-2 pt-2 border-t border-slate-700 text-slate-300 whitespace-pre-wrap">${op.full_text || op.text || '本文なし'}</div>
                    </div>
                    <div class="flex justify-end">
                        <button onclick="event.stopPropagation(); toggleAccordion('${op.id}')" id="btn-toggle-${op.id}" class="text-xs text-blue-400 hover:text-blue-300 underline">全文を表示</button>
                    </div>
                `;
                opList.appendChild(div);
            });
        }

        function selectOpinionForChart(op, cardElement) {
            document.querySelectorAll('#detail-opinions > div').forEach(el => el.classList.remove('ring-2', 'ring-blue-500', 'bg-slate-700'));
            cardElement.classList.add('bg-slate-700', 'ring-2', 'ring-blue-500');
            const pNode = graphData.nodes.find(n => n.id === STATE.selectedProject);

            // Show single opinion with aggregate as comparison
            const opIds = graphData.edges.filter(e => e.target === pNode.id && e.type === 'TARGETS').map(e => e.source);
            const allOpinions = graphData.nodes.filter(n => opIds.includes(n.id) && n.type === 'Opinion');

            const datasets = [
                { label: '選択した発言', ops: [op], color: '#3b82f6', fill: true },
                { label: 'プロジェクト全体', ops: allOpinions, color: '#94a3b8', fill: false, dashed: true }
            ];

            renderDynamicValueChart(datasets, pNode);
            document.getElementById('chart-context-label').innerText = "選択した発言";
        }

        function toggleAccordion(id) {
            const summary = document.getElementById(`summary-${id}`);
            const full = document.getElementById(`full-${id}`);
            const btn = document.getElementById(`btn-toggle-${id}`);
            if (full.classList.contains('hidden')) {
                full.classList.remove('hidden');
                summary.classList.add('hidden');
                btn.innerText = '閉じる';
            } else {
                full.classList.add('hidden');
                summary.classList.remove('hidden');
                btn.innerText = '全文を表示';
            }
        }

        function renderDynamicValueChart(datasetsInfo, projectNode) {
            const ctx = document.getElementById('valueChart').getContext('2d');
            if (valueChartInstance) valueChartInstance.destroy();

            const chartDatasets = datasetsInfo.map(ds => {
                const sums = {};
                VALUE_AXES_DEF.forEach(a => sums[a.id] = 0);
                let count = 0;
                ds.ops.forEach(op => {
                    if (op.values) {
                        count++;
                        Object.keys(op.values).forEach(k => {
                            if (sums[k] !== undefined) sums[k] += op.values[k];
                        });
                    }
                });
                const data = VALUE_AXES_DEF.map(a => count > 0 ? (sums[a.id] / count) : 0);

                return {
                    label: ds.label,
                    data: data,
                    backgroundColor: ds.fill ? (ds.color + '33') : 'transparent', // 33 is ~0.2 opacity
                    borderColor: ds.color,
                    borderWidth: ds.dashed ? 1 : 2,
                    borderDash: ds.dashed ? [5, 5] : [],
                    pointRadius: ds.dashed ? 0 : 3,
                    pointBackgroundColor: ds.color,
                };
            });

            valueChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: VALUE_AXES_DEF.map(a => a.label),
                    datasets: chartDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0,
                            max: 10,
                            angleLines: { color: '#334155' },
                            grid: { color: '#334155' },
                            pointLabels: {
                                color: (ctx) => {
                                    return VALUE_AXES_DEF[ctx.index] ? VALUE_AXES_DEF[ctx.index].color : '#fff';
                                },
                                font: { size: 10, weight: 'bold' }
                            },
                            ticks: {
                                display: false, // Cleaner look for comparison
                                stepSize: 2
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                color: '#94a3b8',
                                boxWidth: 10,
                                font: { size: 10 }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return context.dataset.label + ': ' + context.raw.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }

        function setDetailFilter(f) {
            STATE.detailFilter = f;
            ['all', 'councilor', 'authority'].forEach(t => {
                const btn = document.getElementById('btn-d-' + t);
                if (btn) {
                    btn.className = t === f
                        ? 'px-2 py-1 text-[10px] md:text-xs font-bold rounded bg-blue-600 text-white transition'
                        : 'px-2 py-1 text-[10px] md:text-xs font-bold rounded text-slate-400 hover:text-white transition';
                }
            });
            renderDetailContent(STATE.selectedProject);
        }

        window.onload = renderRanking;
    </script>
</body>

</html>
